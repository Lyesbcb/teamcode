name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 scripts/check-module-graph.py
      - run: ./gradlew :api:jvmTest :client:jvmTest :domain:test :infrastructure:test :presentation:test :cli:jvmTest :app:buildFatJar
      - run: python3 scripts/smoke-replicas.py --jar app/build/libs/app-all.jar
      - uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: app/build/libs/app-all.jar
          retention-days: 1
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 scripts/check-helm.py
      - name: Validate Kubernetes schemas
        run: |
          curl --fail --location --retry 2 https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template teamcode helm/teamcode --set publicUrl=https://teamcode.example.org | ./kubeconform -strict -summary
          helm template teamcode helm/teamcode --set publicUrl=https://teamcode.example.org --set mysql.enabled=false --set mysql.jdbcUrl=jdbc:mysql://db:3306/teamcode --set autoscaling.enabled=true | ./kubeconform -strict -summary
  image:
    needs: [jvm, helm, native, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: app/build/libs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          username: nathanfallet
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            nathanfallet/teamcode:latest
            nathanfallet/teamcode:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/nathanfallet/teamcode
            org.opencontainers.image.licenses=Apache-2.0
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Linux transport dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Select native target
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) target=MacosArm64; directory=macosArm64 ;;
            Darwin-x86_64) target=MacosX64; directory=macosX64 ;;
            Linux-x86_64) target=LinuxX64; directory=linuxX64 ;;
            *) echo 'Unsupported runner architecture'; exit 1 ;;
          esac
          echo "NATIVE_TARGET=$target" >> "$GITHUB_ENV"
          echo "NATIVE_DIRECTORY=$directory" >> "$GITHUB_ENV"
      - run: ./gradlew :cli:linkDebugExecutable${NATIVE_TARGET} :app:buildFatJar
      - run: python3 scripts/smoke-native.py --binary cli/build/bin/${NATIVE_DIRECTORY}/debugExecutable/teamcode.kexe --jar app/build/libs/app-all.jar
      - run: python3 scripts/smoke-run.py --binary cli/build/bin/${NATIVE_DIRECTORY}/debugExecutable/teamcode.kexe --jar app/build/libs/app-all.jar
      - run: python3 scripts/smoke-hook.py --binary cli/build/bin/${NATIVE_DIRECTORY}/debugExecutable/teamcode.kexe
      - name: Start Linux user service manager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - run: python3 scripts/smoke-service.py --binary cli/build/bin/${NATIVE_DIRECTORY}/debugExecutable/teamcode.kexe
      - name: Verify persistent team setup with the native CLI
        if: runner.os == 'Linux'
        run: python3 scripts/smoke-team.py --binary cli/build/bin/${NATIVE_DIRECTORY}/debugExecutable/teamcode.kexe --jar app/build/libs/app-all.jar
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-${{ env.NATIVE_DIRECTORY }}
          path: cli/build/bin/${{ env.NATIVE_DIRECTORY }}/debugExecutable/teamcode.kexe
          retention-days: 7
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :cli:linkDebugExecutableMingwX64
      - run: python scripts/smoke-windows.py --binary cli/build/bin/mingwX64/debugExecutable/teamcode.exe --allow-machine-test-certificate
      - run: python scripts/smoke-hook.py --binary cli/build/bin/mingwX64/debugExecutable/teamcode.exe
      - uses: actions/upload-artifact@v4
        with:
          name: teamcode-windows-x64
          path: cli/build/bin/mingwX64/debugExecutable/teamcode.exe
          retention-days: 7
